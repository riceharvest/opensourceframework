# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directories:
      - "."
      - "packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    
    # Labels for pull requests
    labels:
      - "dependencies"
      - "security"
    
    # Reviewers for security updates
    reviewers:
      - "dario"
    
    # Commit message options
    commit-message:
      prefix: "deps"
      include: "scope"
    
    # Group minor and patch updates
    groupings:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: ".github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"

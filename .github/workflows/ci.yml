name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  TURBO_CACHE_DIR: .turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  detect-affected:
    name: Detect affected packages
    runs-on: ubuntu-latest
    outputs:
      turbo_filter: ${{ steps.detect.outputs.turbo_filter }}
      has_targets: ${{ steps.detect.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Detect changed scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -n "${{ github.base_ref }}" ]; then
              git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            fi
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            fi
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD)

          # If root files that impact all packages changed, run full matrix.
          if echo "$CHANGED_FILES" | grep -Eq '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^turbo\.json$|^\.npmrc$|^\.nvmrc$|^pnpmfile\.(cjs|js)$|^\.husky/|^\.changeset/|^\.github/workflows/'; then
            echo "turbo_filter=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If no package files changed, there is nothing for turbo to scope to.
          if ! echo "$CHANGED_FILES" | grep -Eq '^packages/|^tools/'; then
            echo "turbo_filter=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILTER="...[${BASE_SHA}]"
          DRY_RUN_OUT="/tmp/turbo-dry-run.json"

          if ! pnpm dlx turbo@2.8.15 run test:coverage --filter="$FILTER" --dry-run=json > "$DRY_RUN_OUT"; then
            echo "turbo_filter=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TASK_COUNT=$(jq '.tasks | length' "$DRY_RUN_OUT")
          if [ "$TASK_COUNT" -gt 0 ]; then
            echo "turbo_filter=$FILTER" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "turbo_filter=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

  # Matrix testing across Node versions and OS
  test-matrix:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: [detect-affected]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Only run full matrix on Linux.
          # For Windows and macOS, only run the LTS version (Node 20)
          - node: 18
            os: windows-latest
          - node: 22
            os: windows-latest
          - node: 18
            os: macos-latest
          - node: 22
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'pnpm-workspace.yaml', '.github/workflows/ci.yml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.node }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test
        run: |
          if [ "${{ needs.detect-affected.outputs.has_targets }}" = "true" ]; then
            pnpm turbo run test:coverage --cache-dir="$TURBO_CACHE_DIR" --filter="${{ needs.detect-affected.outputs.turbo_filter }}"
          else
            pnpm turbo run test:coverage --cache-dir="$TURBO_CACHE_DIR"
          fi
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20

      - name: Test (no coverage)
        run: |
          if [ "${{ needs.detect-affected.outputs.has_targets }}" = "true" ]; then
            pnpm turbo run test --cache-dir="$TURBO_CACHE_DIR" --filter="${{ needs.detect-affected.outputs.turbo_filter }}"
          else
            pnpm turbo run test --cache-dir="$TURBO_CACHE_DIR"
          fi
        if: matrix.os != 'ubuntu-latest' || matrix.node != 20

      - name: Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint
    needs: [detect-affected]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-20-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-20-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: |
          if [ "${{ needs.detect-affected.outputs.has_targets }}" = "true" ]; then
            pnpm turbo run lint --cache-dir="$TURBO_CACHE_DIR" --filter="${{ needs.detect-affected.outputs.turbo_filter }}"
          else
            pnpm turbo run lint --cache-dir="$TURBO_CACHE_DIR"
          fi

  typecheck:
    name: Type Check
    needs: [detect-affected]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-20-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-20-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Type Check
        run: |
          if [ "${{ needs.detect-affected.outputs.has_targets }}" = "true" ]; then
            pnpm turbo run typecheck --cache-dir="$TURBO_CACHE_DIR" --filter="${{ needs.detect-affected.outputs.turbo_filter }}"
          else
            pnpm turbo run typecheck --cache-dir="$TURBO_CACHE_DIR"
          fi

  build:
    name: Build
    needs: [lint, typecheck, test-matrix, detect-affected]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-20-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-20-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: |
          if [ "${{ needs.detect-affected.outputs.has_targets }}" = "true" ]; then
            pnpm turbo run build --cache-dir="$TURBO_CACHE_DIR" --filter="${{ needs.detect-affected.outputs.turbo_filter }}"
          else
            pnpm turbo run build --cache-dir="$TURBO_CACHE_DIR"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      # Snyk security scan for vulnerability detection
      # Note: The SNYK_TOKEN is automatically masked by GitHub Actions and will not appear in logs.
      # For detailed vulnerability reports, monitor the Snyk dashboard directly at https://snyk.io
      # rather than relying solely on CI output.
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

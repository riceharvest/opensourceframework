name: Bundle Size

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-ubuntu-latest-20-${{ github.sha }}
          restore-keys: |
            turbo-ubuntu-latest-20-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      
      - name: Build packages
        run: pnpm turbo run build --filter="./packages/**" --cache-dir=".turbo"

      - name: Check bundle sizes
        run: |
          for pkg in next-compose-plugins next-transpile-modules next-cookies next-seo next-session next-iron-session next-pwa next-auth critters next-csrf; do
            npx bundle-phobia-cli @opensourceframework/$pkg --limit 50 || echo "Failed to check $pkg"
          done

      - name: Upload bundle size report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: bundle-size-report.json
          if-no-files-found: ignore
          retention-days: 30

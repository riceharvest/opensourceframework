name: 🚀 Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement']
projects: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature request!

        Please fill out this template to help us understand your proposal.

  - type: dropdown
    id: package
    attributes:
      label: Package Name
      description: Which package would benefit from this feature?
      options:
        - "@opensourceframework/next-csrf"
        - "@opensourceframework/next-images"
        - "@opensourceframework/critters"
        - "@opensourceframework/next-json-ld"
        - "@opensourceframework/next-circuit-breaker"
        - "@opensourceframework/react-a11y-utils"
        - "@opensourceframework/seeded-rng"
        - "@opensourceframework/next-seo"
        - "@opensourceframework/next-transpile-modules"
        - "@opensourceframework/next-compose-plugins"
        - "@opensourceframework/next-cookies"
        - "@opensourceframework/next-auth"
        - "@opensourceframework/next-pwa"
        - "@opensourceframework/react-virtualized"
        - "@opensourceframework/next-session"
        - "@opensourceframework/next-iron-session"
        - "@opensourceframework/next-mdx"
        - Monorepo/Tooling
        - Multiple Packages
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature
      placeholder: |
        Example: Add support for custom CSRF token generators

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Describe the problem this feature would solve.
        Why is this needed? What pain point does it address?
      placeholder: |
        Currently, I can only use the default token generator...

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Describe your proposed solution.
        How should it work? What API would you like to see?
      placeholder: |
        Add a `customGenerator` option to the config...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: |
        Describe any alternative solutions you've considered.
        What are the trade-offs?
      placeholder: |
        I could implement my own token generator, but...

  - type: textarea
    id: usage
    attributes:
      label: Usage Example
      description: |
        Show how you would use this feature
      placeholder: |
        ```typescript
        const csrf = createCSRF({
          customGenerator: async () => {
            return generateCustomToken();
          }
        });
        ```

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests
          required: true
        - label: This is a genuine feature request
          required: true
        - label: I understand this will be reviewed by maintainers
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical (blocking my project)
      default: 0

  - type: markdown
    attributes:
      value: |
        ---

        **Note:** For security vulnerabilities, please see our [Security Policy](SECURITY.md) - do not create a public issue.
